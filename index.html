<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EL JEWEL LIGHTING Catalog vol.8 ／ Visual Comfort &amp; Co. Edition</title>
<meta name="description" content="エルジュエル ライティング カタログ。Visual Comfort & Co. の照明を掲載。">
<meta name="theme-color" content="#30353b">
<style>
:root{
  --brand:#30353b; --brand-ink:#fff; --accent:#5a98dd;
  --bg:#ecebe8; --surface:#fff; --ink:#1f2326; --muted:#6b7177; --line:#d9d7d3; --chip:#fff;
  --shadow:0 1px 2px rgba(0,0,0,.08),0 4px 14px rgba(0,0,0,.08);
  --serif:"Yu Mincho","YuMincho","Hiragino Mincho ProN","Noto Serif JP",serif;
  --sans:"Yu Gothic","YuGothic","Hiragino Sans","Noto Sans JP","Meiryo",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17191b; --surface:#23272b; --ink:#eceae6; --muted:#9aa0a6; --line:#3a3f44; --chip:#2b3034;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#17191b; --surface:#23272b; --ink:#eceae6; --muted:#9aa0a6; --line:#3a3f44; --chip:#2b3034;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6}
button,input,select{font:inherit;color:inherit}
a{color:inherit}
[hidden]{display:none!important}

/* ヘッダー */
.top{position:sticky;top:0;z-index:20;background:var(--brand);color:var(--brand-ink);padding-top:env(safe-area-inset-top)}
.bar{max-width:1200px;margin:0 auto;padding:10px 16px 0;display:flex;align-items:center;gap:12px}
.logo{font-family:var(--serif);letter-spacing:.14em;line-height:1.25;flex:1;min-width:0}
.logo b{display:block;font-weight:500;font-size:15px;letter-spacing:.12em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo small{display:block;font-size:10px;letter-spacing:.14em;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shop{flex:none;font-size:12px;text-decoration:none;border:1px solid rgba(255,255,255,.5);border-radius:999px;padding:5px 12px;white-space:nowrap}
.tabs{max-width:1200px;margin:0 auto;display:flex;padding:0 8px}
.tab{flex:1;max-width:220px;background:none;border:0;color:rgba(255,255,255,.65);padding:12px 8px 10px;font-size:14px;letter-spacing:.08em;border-bottom:3px solid transparent;cursor:pointer}
.tab[aria-selected="true"]{color:#fff;border-bottom-color:var(--accent)}
.chips{position:sticky;z-index:15;background:var(--bg);border-bottom:1px solid var(--line)}
.chips-in{max-width:1200px;margin:0 auto;display:flex;gap:8px;overflow-x:auto;padding:10px 16px;scrollbar-width:none}
.chips-in::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:6px 14px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.chip small{opacity:.6;margin-left:4px}

/* ページ表示 */
#pages{max-width:1200px;margin:0 auto;padding:16px 8px 80px}
.row{display:flex;justify-content:center;gap:0;margin:0 auto 14px}
.pg{position:relative;width:100%;max-width:640px;background:#fff;box-shadow:var(--shadow);cursor:zoom-in}
.pg img{display:block;width:100%;height:auto}
.pg .no{position:absolute;left:0;right:0;bottom:-22px;text-align:center;font-size:11px;color:var(--muted)}
.row{padding-bottom:18px}
.hot{position:absolute;border:0;padding:0;background:transparent;cursor:pointer;border-radius:4px}
.hot:hover,.hot:focus-visible{background:rgba(90,152,221,.14);outline:2px solid var(--accent)}
.pg.hint .hot{animation:hint 1.6s ease-out 1}
@keyframes hint{0%,30%{background:rgba(90,152,221,.22)}100%{background:transparent}}
@media (min-width:900px){
  #pages{padding:24px 16px 80px}
  .row .pg{width:50%;max-width:560px}
  .row.single .pg{width:50%}
}
.tip{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;background:rgba(31,35,38,.92);color:#fff;font-size:13px;padding:10px 16px;border-radius:999px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center;max-width:calc(100% - 32px)}
.tip button{background:none;border:0;color:#9cc4f0;cursor:pointer;padding:0 2px;white-space:nowrap}

/* 商品一覧 */
#items{max-width:1200px;margin:0 auto;padding:12px 16px 80px}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.search{flex:1 1 100%;position:relative}
.search input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 14px 11px 38px;font-size:16px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.tools select{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 10px;font-size:14px}
@media (min-width:700px){.search{flex:1 1 320px}.tools select{flex:0 0 200px}}
.count{font-size:13px;color:var(--muted);margin:4px 2px 12px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:960px){.grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}}
.card{display:flex;flex-direction:column;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;padding:0;cursor:pointer}
.ph{aspect-ratio:1;background-color:#fff;background-repeat:no-repeat;background-size:cover}
.card .tx{padding:8px 10px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.card .nm{font-family:var(--serif);font-size:13.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .cd{font-size:11px;color:var(--muted);overflow-wrap:anywhere;line-height:1.35}
.card .pr{font-weight:700;font-size:14px;margin-top:4px}
.card .pr small{font-weight:400;font-size:10px;color:var(--muted);margin-left:2px}
.empty{padding:48px 0;text-align:center;color:var(--muted)}

/* 商品の詳細（下から出るシート） */
.dim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);opacity:0;transition:opacity .2s}
.dim.on{opacity:1}
.sheet{position:fixed;z-index:41;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--surface);border-radius:16px 16px 0 0;padding:8px 20px calc(20px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .25s ease}
.sheet.on{transform:none}
@media (min-width:760px){.sheet{left:50%;right:auto;bottom:auto;top:50%;width:720px;max-height:86vh;border-radius:16px;transform:translate(-50%,-46%);opacity:0;transition:opacity .2s,transform .2s}.sheet.on{transform:translate(-50%,-50%);opacity:1}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 12px}
.x{position:absolute;right:10px;top:10px;width:36px;height:36px;border-radius:50%;border:0;background:var(--bg);font-size:20px;line-height:1;cursor:pointer}
.sh{display:grid;gap:16px}
@media (min-width:760px){.sh{grid-template-columns:300px 1fr;align-items:start;padding-top:16px}.grab{display:none}}
.sh .ph{border-radius:10px;border:1px solid var(--line);max-width:340px;width:100%;margin:0 auto}
.sh h2{font-family:var(--serif);font-weight:500;font-size:21px;line-height:1.35;margin:0 0 2px;padding-right:36px}
.meta{font-size:12px;color:var(--muted);margin-bottom:12px}
.spec{width:100%;border-collapse:collapse;font-size:14px}
.spec th{width:5.5em;text-align:left;font-weight:400;color:var(--muted);padding:7px 0;vertical-align:top;border-bottom:1px solid var(--line)}
.spec td{padding:7px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.price{font-size:24px;font-weight:700;margin:14px 0 2px}
.price small{font-size:12px;font-weight:400;color:var(--muted);margin-left:4px}
.note{font-size:11px;color:var(--muted);margin:0 0 14px}
.acts{display:flex;flex-direction:column;gap:8px}
.btn{display:block;text-align:center;text-decoration:none;border-radius:10px;padding:13px 16px;font-size:15px;cursor:pointer;border:1px solid var(--line);background:var(--surface)}
.btn.main{background:var(--brand);border-color:var(--brand);color:#fff}
:root[data-theme="dark"] .btn.main{background:var(--accent);border-color:var(--accent)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.main{background:var(--accent);border-color:var(--accent)}}

/* 拡大ビューア */
.vw{position:fixed;inset:0;z-index:50;background:#111;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none}
.stage{position:absolute;inset:0;overflow:hidden}
.zoom{position:absolute;left:0;top:0;transform-origin:0 0}
.zoom img{position:absolute;inset:0;width:100%;height:100%;display:block;-webkit-user-drag:none}
.zoom .hot{pointer-events:auto}
.vtop,.vbot{position:absolute;left:0;right:0;display:flex;align-items:center;gap:8px;padding:10px 12px;pointer-events:none}
.vtop{top:0;padding-top:calc(10px + env(safe-area-inset-top));background:linear-gradient(rgba(0,0,0,.55),transparent)}
.vbot{bottom:0;justify-content:center;padding-bottom:calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.55))}
.vtop>*,.vbot>*{pointer-events:auto}
.vt{flex:1;font-size:13px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vb{width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:20px;line-height:1;cursor:pointer;display:grid;place-items:center}
.vb:disabled{opacity:.3}
.vhelp{font-size:12px;opacity:.75;margin:0 6px;min-width:6em;text-align:center}
</style>
</head>

":"https://www.eljewell-chandelier.com/view/item/000000050656","brand":"Sean Lavin","p":50,"s":19,"box":[0.2316,0.7792,0.1663,0.1777]},{"code":"TEC-SLTB25727B","size":"W155×D155×H196mm","bulb":"集積LED","weight":"0.9kg","price":"72,600円","yen":72600,"name":"Sesa Short Accent Rechargeable Table Lamp","cat":"テーブルライト","url":"https://www.eljewell-chandelier.com/view/item/000000050657","brand":"Sean Lavin","p":50,"s":20,"box":[0.4168,0.7792,0.1663,0.1777]}]}</script>
<script>
const D = JSON.parse(document.getElementById("data").textContent);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = i => String(i + 1).padStart(2, "0");
const store = {get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const P = D.products, N = D.pages.length;
P.forEach((p, i) => { p.i = i; p.key = (p.code + " " + (p.name || "") + " " + (p.cat || "") + " " + p.brand).normalize("NFKC").toLowerCase().replace(/[-\s]/g, ""); });

$("#ttl").textContent = D.title; $("#sub").textContent = D.subtitle.toUpperCase(); $("#shop").href = D.shop;
const pageName = i => { const l = D.pages[i].label; return /^\d+$/.test(l) ? `P.${l}` : l; };

/* ---------- 共通：商品写真（ページごとのスプライト画像の1コマ） ---------- */
function photoStyle(p) {
  const n = D.pages[p.p].n;
  return `background-image:url(sp/${pad(p.p)}.webp?v=${D.v});background-size:${n * 100}% 100%;background-position:${n > 1 ? p.s / (n - 1) * 100 : 0}% 0`;
}
const lazy = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) { e.target.setAttribute("style", e.target.dataset.bg); lazy.unobserve(e.target); }
}), {rootMargin: "400px"});

/* ---------- ページ表示 ---------- */
function hotspots(i) {
  return P.filter(p => p.p === i).map(p => { const [x, y, w, h] = p.box;
    return `<button class="hot" data-i="${p.i}" aria-label="${esc(p.code)}" style="left:${x*100}%;top:${y*100}%;width:${w*100}%;height:${h*100}%"></button>`; }).join("");
}
function buildPages() {
  const wide = matchMedia("(min-width:900px)").matches;
  const rows = [];
  if (wide) { rows.push([0]); for (let i = 1; i < N - 1; i += 2) rows.push(i + 1 < N - 1 ? [i, i + 1] : [i]); rows.push([N - 1]); }
  else for (let i = 0; i < N; i++) rows.push([i]);
  const w = 1000, h = Math.round(1000 * D.ratio);
  $("#pages").innerHTML = rows.map(r => `<div class="row${r.length < 2 ? " single" : ""}">` + r.map(i =>
    `<div class="pg" id="page-${i}" data-p="${i}"><img src="lo/${pad(i)}.webp?v=${D.v}" width="${w}" height="${h}" alt="${esc(pageName(i))}" ${i > 1 ? 'loading="lazy"' : ""} decoding="async">${hotspots(i)}<span class="no">${esc(pageName(i))}</span></div>`
  ).join("") + `</div>`).join("");
  document.querySelectorAll(".pg").forEach(el => seen.observe(el));
}
let curBrand = "";
const seen = new IntersectionObserver(es => es.forEach(e => {
  if (!e.isIntersecting) return;
  const i = +e.target.dataset.p;
  if (!e.target.dataset.hinted && D.pages[i].n) { e.target.dataset.hinted = 1; e.target.classList.add("hint"); }
  const b = D.pages[i].brand;
  if (view === "pages" && b !== curBrand) { curBrand = b; markChips(); }
}), {rootMargin: "-45% 0px -45% 0px"});
$("#pages").addEventListener("click", e => {
  const hot = e.target.closest(".hot"); if (hot) return openSheet(P[+hot.dataset.i]);
  const pg = e.target.closest(".pg"); if (pg) openViewer(+pg.dataset.p);
});
function goPage(i) {
  setView("pages");
  const el = document.getElementById("page-" + i);
  const off = $(".top").offsetHeight + $("#chips").offsetHeight + 8;
  window.scrollTo({top: el.getBoundingClientRect().top + scrollY - off, behavior: "smooth"});
}

/* ---------- ブランドのチップ ---------- */
let fBrand = "";
function buildChips() {
  const cnt = b => P.filter(p => p.brand === b).length;
  $("#chipsIn").innerHTML = (view === "items" ? `<button class="chip" data-b="">すべて<small>${P.length}</small></button>` : `<button class="chip" data-b="" data-go="1">目次</button>`) +
    D.brands.map(b => `<button class="chip" data-b="${esc(b.name)}">${esc(b.name)}${view === "items" ? `<small>${cnt(b.name)}</small>` : ""}</button>`).join("");
  markChips();
}
function markChips() {
  const act = view === "items" ? fBrand : curBrand;
  document.querySelectorAll(".chip").forEach(c => {
    const on = c.dataset.b === act && (view === "items" || act !== "");
    c.setAttribute("aria-pressed", on);
    if (on && view === "pages") c.scrollIntoView({inline: "center", block: "nearest", behavior: "smooth"});
  });
}
$("#chipsIn").addEventListener("click", e => {
  const c = e.target.closest(".chip"); if (!c) return;
  if (view === "items") { fBrand = c.dataset.b; markChips(); renderItems(); return; }
  if (c.dataset.go) return goPage(1);
  goPage(D.brands.find(b => b.name === c.dataset.b).page);
});

/* ---------- 商品一覧 ---------- */
function buildCats() {
  const m = new Map(); P.forEach(p => p.cat && m.set(p.cat, (m.get(p.cat) || 0) + 1));
  $("#cat").innerHTML = `<option value="">すべてのカテゴリー</option>` + [...m].sort((a, b) => b[1] - a[1]).map(([c, n]) => `<option value="${esc(c)}">${esc(c)}（${n}）</option>`).join("");
  $("#cat").hidden = m.size === 0;
}
function renderItems() {
  const q = $("#q").value.normalize("NFKC").toLowerCase().replace(/[-\s]/g, ""), cat = $("#cat").value, sort = $("#sort").value;
  let list = P.filter(p => (!fBrand || p.brand === fBrand) && (!cat || p.cat === cat) && (!q || p.key.includes(q)));
  if (sort === "low") list = [...list].sort((a, b) => a.yen - b.yen);
  if (sort === "high") list = [...list].sort((a, b) => b.yen - a.yen);
  $("#count").textContent = `${list.length}点`;
  $("#grid").innerHTML = list.length ? list.map(p => `<button class="card" data-i="${p.i}"><div class="ph" data-bg="${photoStyle(p)}"></div><div class="tx">
    <span class="nm">${esc(p.name || p.code)}</span><span class="cd">${esc(p.code)}</span><span class="pr">${esc(p.price)}<small>税込</small></span></div></button>`).join("")
    : `<div class="empty" style="grid-column:1/-1">該当する商品がありません</div>`;
  document.querySelectorAll("#grid .ph").forEach(el => lazy.observe(el));
}
let qt; $("#q").addEventListener("input", () => { clearTimeout(qt); qt = setTimeout(renderItems, 120); });
$("#cat").addEventListener("change", renderItems); $("#sort").addEventListener("change", renderItems);
$("#grid").addEventListener("click", e => { const c = e.target.closest(".card"); if (c) openSheet(P[+c.dataset.i]); });

/* ---------- 表示の切り替え ---------- */
let view = "pages";
const scrollPos = {pages: 0, items: 0};
function setView(v) {
  if (v === view) return;
  scrollPos[view] = scrollY; view = v;
  $("#pages").hidden = v !== "pages"; $("#items").hidden = v !== "items";
  $("#t-pages").setAttribute("aria-selected", v === "pages"); $("#t-items").setAttribute("aria-selected", v === "items");
  buildChips();
  if (v === "items" && !$("#grid").children.length) renderItems();
  window.scrollTo(0, scrollPos[v]);
  history.replaceState(null, "", v === "items" ? "#items" : location.pathname + location.search);
}
$("#t-pages").onclick = () => setView("pages"); $("#t-items").onclick = () => setView("items");
const fitChips = () => $("#chips").style.top = $(".top").offsetHeight + "px";

/* ---------- 商品の詳細 ---------- */
let sheetFrom = null;
function openSheet(p) {
  const rows = [["型番", p.code], ["サイズ", p.size], ["電球", p.bulb], ["重量", p.weight]].filter(r => r[1]);
  $("#sbody").innerHTML = `<div class="sh"><div class="ph" style="${photoStyle(p)}"></div><div>
    <h2>${esc(p.name || p.code)}</h2><div class="meta">${esc([p.brand, p.cat].filter(Boolean).join(" ／ "))}</div>
    <table class="spec">${rows.map(r => `<tr><th>${r[0]}</th><td>${esc(r[1])}</td></tr>`).join("")}</table>
    <div class="price">${esc(p.price)}<small>（税込）</small></div>
    <p class="note">価格は2026年10月現在のものです。電球は別売りです。</p>
    <div class="acts">${p.url ? `<a class="btn main" href="${esc(p.url)}" target="_blank" rel="noopener">オンラインストアで見る</a>` : ""}
      <button class="btn" id="sgo">掲載ページを見る（${esc(pageName(p.p))}）</button></div></div></div>`;
  $("#sgo").onclick = () => { closeSheet(); if (!$("#vw").hidden) showPage(p.p); else openViewer(p.p); };
  sheetFrom = document.activeElement;
  $("#dim").hidden = $("#sheet").hidden = false;
  requestAnimationFrame(() => { $("#dim").classList.add("on"); $("#sheet").classList.add("on"); });
  $("#sheet").scrollTop = 0; $("#sx").focus({preventScroll: true});
}
function closeSheet() {
  $("#dim").classList.remove("on"); $("#sheet").classList.remove("on");
  setTimeout(() => { $("#dim").hidden = $("#sheet").hidden = true; }, 250);
  sheetFrom?.focus?.({preventScroll: true});
}
$("#dim").onclick = closeSheet; $("#sx").onclick = closeSheet;
// 下にスワイプで閉じる
(() => { let y0 = null; const s = $("#sheet");
  s.addEventListener("touchstart", e => { y0 = s.scrollTop <= 0 ? e.touches[0].clientY : null; }, {passive: true});
  s.addEventListener("touchend", e => { if (y0 != null && e.changedTouches[0].clientY - y0 > 90) closeSheet(); y0 = null; });
})();

/* ---------- 拡大ビューア（ピンチ・ダブルタップ・スワイプ） ---------- */
const V = {i: 0, s: 1, x: 0, y: 0, bw: 0, bh: 0};
const stage = $("#stage"), zoom = $("#zoom");
function layoutBase() {
  const vw = stage.clientWidth, vh = stage.clientHeight, r = D.ratio;
  V.bw = Math.min(vw, vh / r); V.bh = V.bw * r;
  zoom.style.width = V.bw + "px"; zoom.style.height = V.bh + "px";
}
function clamp() {
  const vw = stage.clientWidth, vh = stage.clientHeight, w = V.bw * V.s, h = V.bh * V.s;
  V.x = w <= vw ? (vw - w) / 2 : Math.min(0, Math.max(vw - w, V.x));
  V.y = h <= vh ? (vh - h) / 2 : Math.min(0, Math.max(vh - h, V.y));
}
function apply(anim) {
  clamp();
  zoom.style.transition = anim ? "transform .22s ease" : "none";
  zoom.style.transform = `translate(${V.x}px,${V.y}px) scale(${V.s})`;
  $("#vh").textContent = V.s > 1.02 ? Math.round(V.s * 100) + "%" : "ピンチで拡大";
  if (V.s > 1.3 && !$("#vhi").src) $("#vhi").src = `hi/${pad(V.i)}.webp?v=${D.v}`;
}
function zoomAt(s, px, py, anim) {
  s = Math.min(5, Math.max(1, s));
  V.x = px - (px - V.x) * (s / V.s); V.y = py - (py - V.y) * (s / V.s); V.s = s; apply(anim);
}
function showPage(i) {
  V.i = Math.max(0, Math.min(N - 1, i)); V.s = 1;
  $("#vlo").src = `lo/${pad(V.i)}.webp?v=${D.v}`; $("#vhi").removeAttribute("src");
  zoom.querySelectorAll(".hot").forEach(h => h.remove());
  zoom.insertAdjacentHTML("beforeend", hotspots(V.i));
  $("#vt").textContent = `${pageName(V.i)}${D.pages[V.i].brand ? "　" + D.pages[V.i].brand : ""}　（${V.i + 1} / ${N}）`;
  $("#vp").disabled = V.i === 0; $("#vn").disabled = V.i === N - 1;
  layoutBase(); apply(false);
  history.replaceState(null, "", "#p" + (V.i + 1));
  [V.i - 1, V.i + 1].forEach(j => { if (j >= 0 && j < N) new Image().src = `lo/${pad(j)}.webp?v=${D.v}`; });
}
function openViewer(i) {
  $("#vw").hidden = false; document.body.style.overflow = "hidden"; showPage(i);
}
function closeViewer() {
  $("#vw").hidden = true; document.body.style.overflow = "";
  history.replaceState(null, "", view === "items" ? "#items" : location.pathname + location.search);
  if (view === "pages") goPage(V.i);
}
$("#vx").onclick = closeViewer;
$("#vp").onclick = () => showPage(V.i - 1); $("#vn").onclick = () => showPage(V.i + 1);
$("#vi").onclick = () => zoomAt(V.s * 1.6, stage.clientWidth / 2, stage.clientHeight / 2, true);
$("#vo").onclick = () => zoomAt(V.s / 1.6, stage.clientWidth / 2, stage.clientHeight / 2, true);
addEventListener("resize", () => { if (!$("#vw").hidden) { layoutBase(); apply(false); } fitChips(); });
addEventListener("keydown", e => {
  if (!$("#sheet").hidden && e.key === "Escape") return closeSheet();
  if ($("#vw").hidden) return;
  if (e.key === "Escape") closeViewer();
  if (e.key === "ArrowRight") showPage(V.i + 1);
  if (e.key === "ArrowLeft") showPage(V.i - 1);
});
stage.addEventListener("wheel", e => { e.preventDefault(); const r = stage.getBoundingClientRect();
  zoomAt(V.s * Math.exp(-e.deltaY / 400), e.clientX - r.left, e.clientY - r.top, false); }, {passive: false});
(() => {
  const pts = new Map(); let g = null, lastTap = 0, moved = false;
  const rel = e => { const r = stage.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  stage.addEventListener("pointerdown", e => {
    stage.setPointerCapture(e.pointerId); pts.set(e.pointerId, rel(e));
    if (pts.size === 1) { moved = false; g = {x0: pts.get(e.pointerId)[0], y0: pts.get(e.pointerId)[1], vx: V.x, vy: V.y, t: Date.now(), target: e.target}; }
    if (pts.size === 2) { const [a, b] = [...pts.values()]; g = {pinch: true, d: Math.hypot(a[0] - b[0], a[1] - b[1]), s: V.s}; moved = true; }
  });
  stage.addEventListener("pointermove", e => {
    if (!pts.has(e.pointerId) || !g) return; pts.set(e.pointerId, rel(e));
    if (g.pinch && pts.size >= 2) { const [a, b] = [...pts.values()];
      zoomAt(g.s * Math.hypot(a[0] - b[0], a[1] - b[1]) / g.d, (a[0] + b[0]) / 2, (a[1] + b[1]) / 2, false); return; }
    if (g.pinch) return;
    const [x, y] = pts.get(e.pointerId), dx = x - g.x0, dy = y - g.y0;
    if (Math.hypot(dx, dy) > 8) moved = true;
    if (V.s > 1.02) { V.x = g.vx + dx; V.y = g.vy + dy; apply(false); }
    else if (moved) zoom.style.transform = `translate(${V.x + dx}px,${V.y}px)`;
  });
  const end = e => {
    if (!pts.has(e.pointerId)) return;
    const p = pts.get(e.pointerId); pts.delete(e.pointerId);
    if (!g) return;
    if (g.pinch) { if (pts.size === 0) { g = null; if (V.s < 1.05) { V.s = 1; apply(true); } } return; }
    const dx = p[0] - g.x0;
    if (!moved) {
      const now = Date.now();
      if (now - lastTap < 300) { lastTap = 0; clearTimeout(g.tapT); zoomAt(V.s > 1.2 ? 1 : 2.6, p[0], p[1], true); }
      else { lastTap = now; const hot = g.target.closest?.(".hot"); if (hot) setTimeout(() => { if (lastTap === now) openSheet(P[+hot.dataset.i]); }, 280); }
    } else if (V.s <= 1.02) {
      if (dx < -60 && V.i < N - 1) showPage(V.i + 1); else if (dx > 60 && V.i > 0) showPage(V.i - 1); else apply(true);
    }
    g = null;
  };
  stage.addEventListener("pointerup", end); stage.addEventListener("pointercancel", end);
})();

/* ---------- はじめに ---------- */
buildPages(); buildChips(); buildCats(); fitChips();
matchMedia("(min-width:900px)").addEventListener("change", buildPages);
if (!store.get("wc-tip")) { $("#tip").hidden = false; setTimeout(() => $("#tip").hidden = true, 9000); }
$("#tipx").onclick = () => { $("#tip").hidden = true; store.set("wc-tip", "1"); };
const h = location.hash;
if (h === "#items") setView("items");
else if (/^#p\d+$/.test(h)) openViewer(+h.slice(2) - 1);
</script>
</body>
</html>
